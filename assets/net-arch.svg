<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="742" viewBox="0 0 1180 742" font-family="Helvetica,Arial,sans-serif">
<rect width="1180" height="742" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1c1c1c"/></marker></defs>
<text x="28" y="40" font-size="21" font-weight="700" fill="#1c1c1c">CSI sensing network — the shapes the cardinality rule admits</text>
<text x="28" y="63" font-size="13" fill="#5a5a5a">Fill shows the IEEE 802.11bf session role, border shows whether the node reports. Each node names its mode, then session role · sensing role, then reporting.</text>
<rect x="28" y="82" width="1124" height="52" rx="7" fill="#fbfbfb" stroke="#d6d6d6"/>
<rect x="44" y="97" width="30" height="21" rx="5" fill="#f6c453" stroke="#b8860b" stroke-width="2"/>
<text x="82" y="107" font-size="12" font-weight="700" fill="#1c1c1c">Initiator</text>
<text x="82" y="120" font-size="11" fill="#5a5a5a">originates the soundings</text>
<rect x="232" y="97" width="30" height="21" rx="5" fill="#9ec9f0" stroke="#2f6fa8" stroke-width="2"/>
<text x="270" y="107" font-size="12" font-weight="700" fill="#1c1c1c">Responder</text>
<text x="270" y="120" font-size="11" fill="#5a5a5a">takes part in them</text>
<rect x="420" y="97" width="30" height="21" rx="5" fill="#cfe8d4" stroke="#3b7d4a" stroke-width="2"/>
<text x="458" y="107" font-size="12" font-weight="700" fill="#1c1c1c">Observer</text>
<text x="458" y="120" font-size="11" fill="#5a5a5a">no session role</text>
<rect x="608" y="97" width="30" height="21" rx="5" fill="#ffffff" stroke="#1c1c1c" stroke-width="2"/>
<text x="646" y="107" font-size="12" font-weight="700" fill="#1c1c1c">Report</text>
<text x="646" y="120" font-size="11" fill="#5a5a5a">reports its CSI</text>
<rect x="796" y="97" width="30" height="21" rx="5" fill="#ffffff" stroke="#1c1c1c" stroke-width="2" stroke-dasharray="5 3"/>
<text x="834" y="107" font-size="12" font-weight="700" fill="#1c1c1c">None</text>
<text x="834" y="120" font-size="11" fill="#5a5a5a">reports nothing</text>
<rect x="984" y="97" width="30" height="21" rx="5" fill="#d9d2e9" stroke="#7d6ca8" stroke-width="2"/>
<text x="1022" y="107" font-size="12" font-weight="700" fill="#1c1c1c">Outside</text>
<text x="1022" y="120" font-size="11" fill="#5a5a5a">not built by this crate</text>
<rect x="28" y="152" width="364" height="246" rx="9" fill="#fbfbfb" stroke="#d6d6d6"/>
<text x="44" y="177" font-size="14" font-weight="700" fill="#1c1c1c">Single node</text>
<text x="44" y="195" font-size="11.5" fill="#5a5a5a">No initiator: the traffic is already on the channel.</text>
<rect x="140" y="294" width="140" height="76" rx="9" fill="#cfe8d4" stroke="#3b7d4a" stroke-width="2.4"/>
<text x="210.0" y="320" font-size="12" font-weight="700" text-anchor="middle" fill="#1c1c1c">Wi-Fi sniffer</text>
<text x="210.0" y="339" font-size="10.5" text-anchor="middle" fill="#5a5a5a">Observer · Receiver</text>
<text x="210.0" y="356" font-size="10.5" text-anchor="middle" fill="#5a5a5a">Report</text>
<ellipse cx="210" cy="240" rx="104" ry="25" fill="#d9d2e9" stroke="#7d6ca8" stroke-width="2" stroke-dasharray="4 4"/>
<text x="210" y="245" font-size="11.5" text-anchor="middle" fill="#5a5a5a">ambient traffic</text>
<line x1="210" y1="266" x2="210" y2="290" stroke="#1c1c1c" stroke-width="2" marker-end="url(#ar)"/>
<rect x="436" y="152" width="364" height="246" rx="9" fill="#fbfbfb" stroke="#d6d6d6"/>
<text x="452" y="177" font-size="14" font-weight="700" fill="#1c1c1c">Point-to-point — controlled sounding</text>
<text x="452" y="195" font-size="11.5" fill="#5a5a5a">The emitter needs no peer, so receivers cost it nothing.</text>
<rect x="454" y="248" width="140" height="76" rx="9" fill="#cfe8d4" stroke="#3b7d4a" stroke-width="2.4" stroke-dasharray="6 4"/>
<text x="524.0" y="274" font-size="12" font-weight="700" text-anchor="middle" fill="#1c1c1c">Emitter</text>
<text x="524.0" y="293" font-size="10.5" text-anchor="middle" fill="#5a5a5a">Observer · Transmitter</text>
<text x="524.0" y="310" font-size="10.5" text-anchor="middle" fill="#5a5a5a">None</text>
<rect x="642" y="248" width="140" height="76" rx="9" fill="#cfe8d4" stroke="#3b7d4a" stroke-width="2.4"/>
<text x="712.0" y="274" font-size="12" font-weight="700" text-anchor="middle" fill="#1c1c1c">Wi-Fi sniffer</text>
<text x="712.0" y="293" font-size="10.5" text-anchor="middle" fill="#5a5a5a">Observer · Receiver</text>
<text x="712.0" y="310" font-size="10.5" text-anchor="middle" fill="#5a5a5a">Report</text>
<line x1="598" y1="286.0" x2="638" y2="286.0" stroke="#1c1c1c" stroke-width="2" marker-end="url(#ar)"/>
<text x="618" y="350" font-size="11" text-anchor="middle" fill="#5a5a5a">sounding frames &#8594;  add sniffers freely</text>
<rect x="812" y="152" width="364" height="246" rx="9" fill="#fbfbfb" stroke="#d6d6d6"/>
<text x="828" y="177" font-size="14" font-weight="700" fill="#1c1c1c">Point-to-point — associated link</text>
<text x="828" y="195" font-size="11.5" fill="#5a5a5a">Either end can report; the AP is always the initiator.</text>
<rect x="830" y="248" width="140" height="76" rx="9" fill="#f6c453" stroke="#b8860b" stroke-width="2.4"/>
<text x="900.0" y="274" font-size="12" font-weight="700" text-anchor="middle" fill="#1c1c1c">Access point</text>
<text x="900.0" y="293" font-size="10.5" text-anchor="middle" fill="#5a5a5a">Initiator · Receiver</text>
<text x="900.0" y="310" font-size="10.5" text-anchor="middle" fill="#5a5a5a">Report</text>
<rect x="1018" y="248" width="140" height="76" rx="9" fill="#cfe8d4" stroke="#3b7d4a" stroke-width="2.4"/>
<text x="1088.0" y="274" font-size="12" font-weight="700" text-anchor="middle" fill="#1c1c1c">Station</text>
<text x="1088.0" y="293" font-size="10.5" text-anchor="middle" fill="#5a5a5a">Observer · Receiver</text>
<text x="1088.0" y="310" font-size="10.5" text-anchor="middle" fill="#5a5a5a">Report</text>
<line x1="974" y1="286.0" x2="1014" y2="286.0" stroke="#1c1c1c" stroke-width="2" marker-end="url(#ar)" marker-start="url(#ar)"/>
<text x="994" y="350" font-size="11" text-anchor="middle" fill="#5a5a5a">a commercial router takes the AP&#8217;s place unchanged</text>
<rect x="28" y="424" width="364" height="246" rx="9" fill="#fbfbfb" stroke="#d6d6d6"/>
<text x="44" y="449" font-size="14" font-weight="700" fill="#1c1c1c">Point-to-point — ESP-NOW</text>
<text x="44" y="467" font-size="11.5" fill="#5a5a5a">Symmetric: every session role and reporting combination works.</text>
<rect x="46" y="520" width="140" height="76" rx="9" fill="#f6c453" stroke="#b8860b" stroke-width="2.4"/>
<text x="116.0" y="546" font-size="12" font-weight="700" text-anchor="middle" fill="#1c1c1c">ESP-NOW</text>
<text x="116.0" y="565" font-size="10.5" text-anchor="middle" fill="#5a5a5a">Initiator · Tx-Rx</text>
<text x="116.0" y="582" font-size="10.5" text-anchor="middle" fill="#5a5a5a">Report or None</text>
<rect x="234" y="520" width="140" height="76" rx="9" fill="#9ec9f0" stroke="#2f6fa8" stroke-width="2.4"/>
<text x="304.0" y="546" font-size="12" font-weight="700" text-anchor="middle" fill="#1c1c1c">ESP-NOW</text>
<text x="304.0" y="565" font-size="10.5" text-anchor="middle" fill="#5a5a5a">Responder · Tx-Rx</text>
<text x="304.0" y="582" font-size="10.5" text-anchor="middle" fill="#5a5a5a">Report or None</text>
<line x1="190" y1="546" x2="230" y2="546" stroke="#1c1c1c" stroke-width="2" marker-end="url(#ar)"/>
<line x1="230" y1="574" x2="190" y2="574" stroke="#1c1c1c" stroke-width="2" marker-end="url(#ar)"/>
<text x="210" y="622" font-size="11" text-anchor="middle" fill="#5a5a5a">control out, replies back — both ends may report</text>
<rect x="436" y="424" width="364" height="246" rx="9" fill="#fbfbfb" stroke="#d6d6d6"/>
<text x="452" y="449" font-size="14" font-weight="700" fill="#1c1c1c">Point-to-point — ESP-NOW simplex</text>
<text x="452" y="467" font-size="11.5" fill="#5a5a5a">One transmitter owns the airtime: the highest CSI rate here.</text>
<rect x="454" y="520" width="140" height="76" rx="9" fill="#f6c453" stroke="#b8860b" stroke-width="2.4" stroke-dasharray="6 4"/>
<text x="524.0" y="546" font-size="12" font-weight="700" text-anchor="middle" fill="#1c1c1c">ESP-NOW simplex</text>
<text x="524.0" y="565" font-size="10.5" text-anchor="middle" fill="#5a5a5a">Initiator · Transmitter</text>
<text x="524.0" y="582" font-size="10.5" text-anchor="middle" fill="#5a5a5a">None</text>
<rect x="642" y="520" width="140" height="76" rx="9" fill="#9ec9f0" stroke="#2f6fa8" stroke-width="2.4"/>
<text x="712.0" y="546" font-size="12" font-weight="700" text-anchor="middle" fill="#1c1c1c">ESP-NOW simplex</text>
<text x="712.0" y="565" font-size="10.5" text-anchor="middle" fill="#5a5a5a">Responder · Receiver</text>
<text x="712.0" y="582" font-size="10.5" text-anchor="middle" fill="#5a5a5a">Report</text>
<line x1="598" y1="546" x2="638" y2="546" stroke="#1c1c1c" stroke-width="2" marker-end="url(#ar)"/>
<line x1="638" y1="574" x2="598" y2="574" stroke="#1c1c1c" stroke-width="2" marker-end="url(#ar)" stroke-dasharray="5 4"/>
<text x="618" y="622" font-size="11" text-anchor="middle" fill="#5a5a5a">flood out; beacon back only until found</text>
<text x="618" y="639" font-size="11" text-anchor="middle" fill="#5a5a5a">the end that floods is the initiator — the role follows the soundings</text>
<rect x="812" y="424" width="364" height="246" rx="9" fill="#fbfbfb" stroke="#d6d6d6"/>
<text x="828" y="449" font-size="14" font-weight="700" fill="#1c1c1c">Star</text>
<text x="828" y="467" font-size="11.5" fill="#5a5a5a">Any number of responders per initiator; none to each other.</text>
<rect x="826" y="484" width="104" height="46" rx="8" fill="#9ec9f0" stroke="#2f6fa8" stroke-width="2.4"/>
<text x="878" y="503" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1c1c1c">ESP-NOW</text>
<text x="878" y="519" font-size="10.5" text-anchor="middle" fill="#5a5a5a">Responder</text>
<rect x="942" y="484" width="104" height="46" rx="8" fill="#9ec9f0" stroke="#2f6fa8" stroke-width="2.4"/>
<text x="994" y="503" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1c1c1c">ESP-NOW</text>
<text x="994" y="519" font-size="10.5" text-anchor="middle" fill="#5a5a5a">Responder</text>
<rect x="1058" y="484" width="104" height="46" rx="8" fill="#9ec9f0" stroke="#2f6fa8" stroke-width="2.4"/>
<text x="1110" y="503" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1c1c1c">ESP-NOW</text>
<text x="1110" y="519" font-size="10.5" text-anchor="middle" fill="#5a5a5a">Responder</text>
<rect x="924" y="568" width="140" height="76" rx="9" fill="#f6c453" stroke="#b8860b" stroke-width="2.4"/>
<text x="994.0" y="594" font-size="12" font-weight="700" text-anchor="middle" fill="#1c1c1c">ESP-NOW</text>
<text x="994.0" y="613" font-size="10.5" text-anchor="middle" fill="#5a5a5a">Initiator · Tx-Rx</text>
<text x="994.0" y="630" font-size="10.5" text-anchor="middle" fill="#5a5a5a">Report or None</text>
<line x1="994" y1="564" x2="878" y2="536" stroke="#1c1c1c" stroke-width="2" marker-end="url(#ar)"/>
<line x1="994" y1="564" x2="994" y2="536" stroke="#1c1c1c" stroke-width="2" marker-end="url(#ar)"/>
<line x1="994" y1="564" x2="1110" y2="536" stroke="#1c1c1c" stroke-width="2" marker-end="url(#ar)"/>
<text x="994" y="656" font-size="11" text-anchor="middle" fill="#5a5a5a">only ESP-NOW supports this shape</text>
<text x="28" y="726" font-size="11.5" fill="#5a5a5a">Tx-Rx = transmitter-receiver. The controller is not drawn: it is the host tier that starts and stops every run — never a node, never the initiator. See docs/network-model.md.</text>
</svg>
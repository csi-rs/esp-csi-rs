[package]
name = "esp-csi-rs-wire-tests"
version = "0.0.0"
edition = "2024"
publish = false
description = "Host-side tests for esp-csi-rs's wire contract (src/lib/wire), compiled from the same source files"

# Standalone: the parent crate only builds for Espressif targets, while this one runs on the host.
[workspace]

[lib]
path = "src/lib.rs"

[features]
# The parent crate's `synthetic` source is compiled here unconditionally, so it is always tested.
default = ["synthetic"]
synthetic = []

[dependencies]
# Must match the parent crate's versions: these tests compile its `src/lib/wire` sources verbatim.
heapless = { version = "0.7", default-features = false, features = ["serde"] }
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
postcard = { version = "1.1.3", features = ["experimental-derive", "heapless"] }
cobs = { version = "0.3", default-features = false }

[dev-dependencies]
postcard = { version = "1.1.3", features = ["experimental-derive", "heapless", "use-std"] }
